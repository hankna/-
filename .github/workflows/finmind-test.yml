name: FinMind API test
on:
  push:
    paths: ['.github/workflows/finmind-test.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test FinMind without exposing credentials
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, re, datetime, urllib.request, urllib.parse, urllib.error
          from zoneinfo import ZoneInfo
          token = os.environ.get('FINMIND_TOKEN', '').strip()
          now = datetime.datetime.now(ZoneInfo('Asia/Taipei'))
          out = {'taipei_time': now.isoformat(), 'secret_present': bool(token), 'tests': []}
          os.makedirs('results', exist_ok=True)
          def save():
              with open('results/finmind-test.json', 'w', encoding='utf-8') as f:
                  json.dump(out, f, ensure_ascii=False, indent=2)
          if not token:
              print('SECRET_MISSING: FINMIND_TOKEN')
              save()
              raise SystemExit(0)
          today = now.date()
          start = today - datetime.timedelta(days=10)
          def scrub(text):
              text = str(text).replace(token, '[REDACTED]')
              return re.sub(r'[A-Za-z0-9_./+=-]{24,}', '[REDACTED]', text)[:300]
          def call(url):
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + token})
              try:
                  response = urllib.request.urlopen(request, timeout=30)
              except urllib.error.HTTPError as error:
                  response = error
              return response.status, json.loads(response.read(4000000))
          # quota check (numbers only)
          try:
              code, info = call('https://api.web.finmindtrade.com/v2/user_info')
              out['quota'] = {'http_status': code, 'used': info.get('user_count'), 'limit': info.get('api_request_limit')}
          except Exception as error:
              out['quota'] = {'error_type': type(error).__name__}
          base = 'https://api.finmindtrade.com/api/v4/'
          tests = [
              ('TAIEX_DAILY', 'data', {'dataset': 'TaiwanStockPrice', 'data_id': 'TAIEX'}),
              ('MTX_FUTURES_DAILY', 'data', {'dataset': 'TaiwanFuturesDaily', 'data_id': 'MTX'}),
              ('TX_INSTITUTIONS', 'data', {'dataset': 'TaiwanFuturesInstitutionalInvestors', 'data_id': 'TX'}),
              ('MTX_INSTITUTIONS', 'data', {'dataset': 'TaiwanFuturesInstitutionalInvestors', 'data_id': 'MTX'}),
              ('TMF_INSTITUTIONS', 'data', {'dataset': 'TaiwanFuturesInstitutionalInvestors', 'data_id': 'TMF'}),
              ('TXO_INSTITUTIONS', 'data', {'dataset': 'TaiwanOptionInstitutionalInvestors', 'data_id': 'TXO'}),
              ('TAIEX_SNAPSHOT', 'taiwan_stock_tick_snapshot', {'data_id': '001'}),
              ('MTX_FUTURES_SNAPSHOT', 'taiwan_futures_snapshot', {'data_id': 'MTX'}),
          ]
          for label, endpoint, params in tests:
              if endpoint == 'data':
                  params.update(start_date=start.isoformat(), end_date=today.isoformat())
              result = {'test': label}
              try:
                  code, payload = call(base + endpoint + '?' + urllib.parse.urlencode(params))
                  rows = payload.get('data')
                  rows = rows if isinstance(rows, list) else []
                  message = str(payload.get('msg', '')).lower()
                  dates = [str(r.get('date', ''))[:10] for r in rows if isinstance(r, dict) and r.get('date')]
                  result.update(
                      http_status=code,
                      api_status=payload.get('status') if isinstance(payload.get('status'), (int, float)) else None,
                      rows=len(rows),
                      message_redacted=scrub(payload.get('msg', '')),
                      access_denied=any(w in message for w in ('sponsor', 'upgrade', 'permission', '權限', '升級', 'level')),
                      credential_rejected=any(w in message for w in ('invalid token', 'unauthorized', 'token expired')),
                      latest_data_time=max(dates) if dates else None,
                      rows_for_today=sum(1 for d in dates if d == today.isoformat()),
                      field_names=sorted(rows[0].keys()) if rows and isinstance(rows[0], dict) else None,
                      usable_response=code == 200 and payload.get('status') == 200 and len(rows) > 0,
                  )
              except Exception as error:
                  result['error_type'] = type(error).__name__
              print(json.dumps({k: v for k, v in result.items() if k != 'field_names'}, ensure_ascii=False))
              out['tests'].append(result)
          out['note'] = 'Metadata only: no market data stored. Daily success does not establish real-time access.'
          save()
          PY
      - name: Save result summary to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/finmind-test.json
          git diff --cached --quiet || (git commit -m "FinMind test result [skip ci]" && git push)
